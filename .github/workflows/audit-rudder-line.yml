name: Diagnose Rudder Phoenix transparency line
on:
  push:
    paths:
      - 'tools/audit_rudder_line.py'
      - '.github/workflows/audit-rudder-line.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - run: python tools/audit_rudder_line.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rudder-line-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Rudder PNG line diagnostics"
            git pull --rebase origin main
            git push origin main
          fi
