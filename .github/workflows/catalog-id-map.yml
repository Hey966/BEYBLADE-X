name: Inspect exact-release part IDs
on:
  push:
    paths: ['tools/catalog_id_map.py','.github/workflows/catalog-id-map.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/catalog_id_map.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-id-map.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exact X part IDs by release"
            git push
          fi
