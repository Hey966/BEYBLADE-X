name: Simulator smoke tests
on:
  push:
    paths:
      - 'sim-engine.js'
      - 'sim-ui.js'
      - 'bit-types.js'
      - 'blade-types.js'
      - 'tests/blade-type-labels.cjs'
      - 'tests/site-official-audit.cjs'
      - 'tests/missing-data-audit.cjs'
      - 'data/image-status.json'
      - 'data/image-sources.json'
      - 'tools/create_png_assets.py'
      - 'style.css'
      - 'index.html'
      - 'app.js'
      - 'analysis.js'
      - 'tests/bit-type-labels.cjs'
      - 'sim-audio.js'
      - 'sim-view.js'
      - 'sim-camera.js'
      - 'tests/stadium-camera-smoke.cjs'
      - 'data/collection.json'
      - 'data/part-abilities.json'
      - 'data/part-abilities.js'
      - 'data/part-stat-overrides.json'
      - 'data/part-physics.json'
      - 'tools/sync_part_abilities.py'
      - 'tests/test_part_sync_overrides.py'
      - 'tests/sim-smoke.cjs'
      - 'tests/sim-ui-smoke.cjs'
      - 'tests/sim-audio-smoke.cjs'
      - '.github/workflows/simulator-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check bit-types.js
          node --check blade-types.js
          node --check app.js
          node --check analysis.js
          node --check sim-engine.js
          node --check sim-ui.js
          node --check sim-view.js
          node --check sim-camera.js
          node --check sim-audio.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline Hasbro packaging corrections and sync guards
        run: python tests/test_part_sync_overrides.py
      - name: Verify missing data status and referenced media
        run: node tests/missing-data-audit.cjs
      - name: Check official rules, source integrity, layout and model units
        run: node tests/site-official-audit.cjs
      - name: Verify Blade and CX subcomponent classifications
        run: node tests/blade-type-labels.cjs
      - name: Verify Bit classifications across collection and UI
        run: node tests/bit-type-labels.cjs
      - name: Validate model and 3on3 restrictions
        run: node tests/sim-smoke.cjs
      - name: Verify camera orbit, zoom, and official stadium sectors
        run: node tests/stadium-camera-smoke.cjs
      - name: Verify arena / selected parts / scoring UI synchronization
        run: node tests/sim-ui-smoke.cjs

      - name: Verify original audio events, mute, pause and audio level
        run: node tests/sim-audio-smoke.cjs
