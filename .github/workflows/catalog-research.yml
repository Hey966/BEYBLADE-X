name: Research exact G3063 product images
on:
  push:
    paths: ['tools/discover_catalog_assets.py', '.github/workflows/catalog-research.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/discover_catalog_assets.py
      - name: Save data sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-research.json
          if ! git diff --cached --quiet; then
            git commit -m "Record image source discovery for G3063"
            git push
          fi
