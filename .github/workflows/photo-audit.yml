name: Research exact-release component photos
on:
  push:
    paths: ['tools/discover_phstudy.py','.github/workflows/photo-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/discover_phstudy.py
      - name: Save image audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photo-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit exact-release image sources"
            git push
          fi
