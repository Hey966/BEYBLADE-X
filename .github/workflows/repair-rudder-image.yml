name: Repair Rudder Phoenix image residual line
on:
  push:
    paths: 
      - 'tools/clean_horizontal_artifacts.py'
      - '.github/workflows/repair-rudder-image.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - run: python tools/clean_horizontal_artifacts.py
      - name: Commit verified transparent PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/reference/own-g3393-01.png data/rudder-line-repair.json
          if ! git diff --cached --quiet; then
            git commit -m "Remove Rudder Phoenix horizontal background remnant"
            git pull --rebase origin main
            git push origin main
          fi
