name: Sync owned Beyblade part abilities
on:
  push:
    branches: [main]
    paths:
      - 'data/collection.json'
      - 'data/image-sources.json'
      - 'tools/sync_part_abilities.py'
      - 'data/part-stat-overrides.json'
      - '.github/workflows/part-abilities.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beyblade-abilities-main
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull catalog and build attributable part database
        run: python tools/sync_part_abilities.py
      - name: Commit ability database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/part-abilities.json data/part-abilities.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh version-specific component abilities"
            git pull --rebase origin main
            git push origin main
          fi
