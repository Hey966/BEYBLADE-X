name: Import verified Beyblade images as transparent PNG
on:
  push:
    paths:
      - 'data/image-sources.json'
      - 'tools/create_png_assets.py'
      - '.github/workflows/reference-images.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beyblade-image-sync-main
  cancel-in-progress: true
jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-processing dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Retrieve photos and generate transparent PNGs
        run: python tools/create_png_assets.py
      - name: Commit PNGs, source audit and site collection data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/reference data/image-status.json data/collection.json data.js
          if ! git diff --cached --quiet; then
            git commit -m "Sync individually verified component PNGs to collection"
            git pull --rebase origin main
            git push origin main
          fi
